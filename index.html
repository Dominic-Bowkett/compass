<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Compass</title>
<style>
  :root {
    --bg: #000;
    --fg: #ffffff;
    --muted: #8a8a8a;
    --tick-minor: #5a5a5a;
    --tick-major: #e0e0e0;
    --pill-bg: #d7c6ff;
    --pill-fg: #3a2a6b;
    --north: #ff3b30;
    --info: #f5c518;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 24px;
    position: relative;
  }
  .pill {
    background: var(--pill-bg);
    color: var(--pill-fg);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.2px;
    padding: 8px 20px;
    border-radius: 999px;
    margin-top: 4px;
  }
  .location {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: var(--fg);
  }
  .info-ico {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border: 1.5px solid var(--info);
    color: var(--info);
    border-radius: 50%;
    font-size: 11px;
    font-style: italic;
    font-family: "Georgia", serif;
    font-weight: 700;
  }
  .heading-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 6px;
    font-weight: 300;
  }
  .heading-num {
    font-size: 38px;
    letter-spacing: 0.5px;
    font-weight: 400;
  }
  .heading-card {
    font-size: 30px;
    font-weight: 400;
  }
  .tri {
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 9px solid var(--fg);
    margin-top: 4px;
  }
  .tick-label {
    font-size: 13px;
    color: var(--fg);
    margin-top: 2px;
    font-weight: 400;
  }
  .compass-wrap {
    position: relative;
    width: min(88vw, 360px);
    aspect-ratio: 1 / 1;
    margin-top: 8px;
  }
  .compass-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .dial {
    transform-origin: 150px 150px;
    transform-box: fill-box;
    will-change: transform;
  }
  .footer {
    margin-top: auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }
  .strength {
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--fg);
    text-transform: uppercase;
  }
  .strength .num { margin-left: 8px; font-weight: 500; }
  .actions {
    display: flex;
    gap: 10px;
  }
  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #2a2a2a;
    border: none;
    color: #d0d0d0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { background: #3a3a3a; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.92);
    z-index: 10;
    padding: 24px;
    text-align: center;
    gap: 14px;
  }
  .overlay p {
    color: var(--muted);
    font-size: 14px;
    max-width: 300px;
    line-height: 1.5;
    margin: 0;
  }
  .overlay .title {
    color: var(--fg);
    font-size: 18px;
    font-weight: 500;
  }
  .enable-btn {
    appearance: none;
    background: var(--pill-bg);
    color: var(--pill-fg);
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 4px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="pill">MAGNETIC HEADING</div>

  <div class="location">
    <span id="locationLabel">Compass</span>
    <span class="info-ico" aria-hidden="true">i</span>
  </div>

  <div class="heading-row">
    <span class="heading-num" id="headingNum">---</span><span class="heading-num">°</span>
    <span class="heading-card" id="headingCard"></span>
  </div>
  <div class="tri" aria-hidden="true"></div>
  <div class="tick-label" id="tickLabel">---</div>

  <div class="compass-wrap">
    <svg viewBox="-30 -30 360 360" aria-hidden="true">
      <g class="dial" id="dial">
        <g id="ticks"></g>
        <g id="degNumbers"></g>
        <!-- Cardinals inside the ring -->
        <text x="150" y="88" text-anchor="middle" dominant-baseline="central"
              fill="#ffffff" font-size="26" font-weight="500">N</text>
        <text x="212" y="150" text-anchor="middle" dominant-baseline="central"
              fill="#ffffff" font-size="26" font-weight="500">E</text>
        <text x="150" y="212" text-anchor="middle" dominant-baseline="central"
              fill="#ffffff" font-size="26" font-weight="500">S</text>
        <text x="88" y="150" text-anchor="middle" dominant-baseline="central"
              fill="#ffffff" font-size="26" font-weight="500">W</text>
        <!-- Red North indicator on the dial -->
        <line x1="30" y1="150" x2="58" y2="150"
              stroke="#ff3b30" stroke-width="2" stroke-linecap="round"
              transform="rotate(-90 150 150)" />
      </g>
      <!-- Fixed center crosshair & dot (do NOT rotate with dial) -->
      <g>
        <line x1="150" y1="138" x2="150" y2="162" stroke="#ffffff" stroke-width="1"/>
        <line x1="138" y1="150" x2="162" y2="150" stroke="#ffffff" stroke-width="1"/>
        <circle cx="150" cy="130" r="4" fill="#9a9a9a"/>
      </g>
    </svg>
  </div>

  <div class="footer">
    <div class="strength">STRENGTH <span class="num" id="strengthVal">-- μT</span></div>
    <div class="actions">
      <button class="icon-btn" id="recenterBtn" aria-label="Recalibrate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="title">Compass</div>
    <p>This app needs motion &amp; orientation access to read the phone's magnetometer.</p>
    <button class="enable-btn" id="startBtn">Enable Compass</button>
    <p id="status" style="font-size:12px;"></p>
  </div>
</div>

<script>
(function () {
  const dial = document.getElementById('dial');
  const headingNum = document.getElementById('headingNum');
  const headingCard = document.getElementById('headingCard');
  const tickLabel = document.getElementById('tickLabel');
  const strengthVal = document.getElementById('strengthVal');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const ticksGroup = document.getElementById('ticks');
  const degNumbers = document.getElementById('degNumbers');

  const CX = 150, CY = 150;
  const R_OUTER = 120;        // outer edge of ticks
  const R_MINOR = 110;        // inner end of minor ticks
  const R_MAJOR = 102;        // inner end of major ticks
  const R_NUMBERS = 138;      // degree label radius (outside ticks)

  const svgNS = 'http://www.w3.org/2000/svg';

  // Build ticks — minor every 3° (thin light gray), major every 30° (white)
  for (let deg = 0; deg < 360; deg += 3) {
    const isMajor = deg % 30 === 0;
    const rad = deg * Math.PI / 180;
    const sin = Math.sin(rad), cos = -Math.cos(rad);
    const x1 = CX + sin * R_OUTER;
    const y1 = CY + cos * R_OUTER;
    const innerR = isMajor ? R_MAJOR : R_MINOR;
    const x2 = CX + sin * innerR;
    const y2 = CY + cos * innerR;
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? '#ffffff' : '#606060');
    line.setAttribute('stroke-width', isMajor ? 2 : 1);
    line.setAttribute('stroke-linecap', 'round');
    ticksGroup.appendChild(line);
  }

  // Degree numbers at 30° (skip 0 — implied by N)
  [30, 60, 120, 150, 180, 210, 240, 270, 300, 330].forEach(deg => {
    const rad = deg * Math.PI / 180;
    const x = CX + Math.sin(rad) * R_NUMBERS;
    const y = CY - Math.cos(rad) * R_NUMBERS;
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('fill', '#ffffff');
    t.setAttribute('font-size', '13');
    t.setAttribute('font-weight', '400');
    t.textContent = String(deg);
    degNumbers.appendChild(t);
  });

  function cardinalLetter(deg) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
  }

  const SENSOR_ALPHA = 0.15;
  const DISPLAY_LERP = 0.18;
  const DEAD_ZONE_DEG = 0.4;

  let filterX = null, filterY = null;
  let targetHeading = 0;
  let displayHeading = 0;
  let lastInt = -1;
  let hasReading = false;

  function shortestAngleDiff(a, b) {
    return ((b - a) % 360 + 540) % 360 - 180;
  }
  function mod360(v) { return ((v % 360) + 360) % 360; }

  function tick() {
    if (hasReading) {
      const current = mod360(displayHeading);
      const diff = shortestAngleDiff(current, targetHeading);
      if (Math.abs(diff) > DEAD_ZONE_DEG) {
        displayHeading += diff * DISPLAY_LERP;
      }
      dial.setAttribute('transform', `rotate(${-displayHeading} ${CX} ${CY})`);
      const rounded = Math.round(mod360(displayHeading)) % 360;
      if (rounded !== lastInt) {
        headingNum.textContent = String(rounded);
        headingCard.textContent = cardinalLetter(mod360(displayHeading));
        const nearest30 = Math.round(mod360(displayHeading) / 30) * 30 % 360;
        tickLabel.textContent = String(nearest30);
        lastInt = rounded;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function onOrientation(event) {
    let heading = null;
    if (typeof event.webkitCompassHeading === 'number' && !isNaN(event.webkitCompassHeading)) {
      heading = event.webkitCompassHeading;
    } else if (event.absolute && typeof event.alpha === 'number') {
      heading = (360 - event.alpha) % 360;
    } else if (typeof event.alpha === 'number') {
      heading = (360 - event.alpha) % 360;
    }
    if (heading === null || isNaN(heading)) return;

    const rad = heading * Math.PI / 180;
    const x = Math.cos(rad);
    const y = Math.sin(rad);
    if (filterX === null) {
      filterX = x; filterY = y;
    } else {
      filterX = filterX * (1 - SENSOR_ALPHA) + x * SENSOR_ALPHA;
      filterY = filterY * (1 - SENSOR_ALPHA) + y * SENSOR_ALPHA;
    }
    targetHeading = (Math.atan2(filterY, filterX) * 180 / Math.PI + 360) % 360;

    if (!hasReading) {
      displayHeading = targetHeading;
      hasReading = true;
      overlay.classList.add('hidden');
    }
  }

  function attachOrientationListeners() {
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', onOrientation, true);
    }
    window.addEventListener('deviceorientation', onOrientation, true);
  }

  // Magnetometer (μT) — Android Chrome only
  function tryMagnetometer() {
    if (typeof Magnetometer === 'undefined') return;
    try {
      const sensor = new Magnetometer({ frequency: 10, referenceFrame: 'device' });
      let mx = 0, my = 0, mz = 0, init = false;
      sensor.addEventListener('reading', () => {
        if (!init) { mx = sensor.x; my = sensor.y; mz = sensor.z; init = true; }
        else {
          mx = mx * 0.85 + sensor.x * 0.15;
          my = my * 0.85 + sensor.y * 0.15;
          mz = mz * 0.85 + sensor.z * 0.15;
        }
        const magnitude = Math.sqrt(mx * mx + my * my + mz * mz);
        strengthVal.textContent = `${magnitude.toFixed(0)} μT`;
      });
      sensor.addEventListener('error', () => {});
      sensor.start();
    } catch (_) { /* permission denied or unsupported */ }
  }

  async function start() {
    startBtn.disabled = true;
    statusEl.textContent = '';
    try {
      const needsPermission = typeof DeviceOrientationEvent !== 'undefined'
        && typeof DeviceOrientationEvent.requestPermission === 'function';
      if (needsPermission) {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state !== 'granted') {
          statusEl.textContent = 'Permission denied. Enable Motion & Orientation in Settings > Safari.';
          startBtn.disabled = false;
          return;
        }
      }
      attachOrientationListeners();
      tryMagnetometer();
      setTimeout(() => {
        if (!hasReading) {
          statusEl.textContent = 'No sensor data yet — try moving the device.';
          startBtn.disabled = false;
        }
      }, 3000);
    } catch (err) {
      statusEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener('click', start);

  // Android: no permission prompt needed — auto-start and hide overlay on first reading.
  const needsPermission = typeof DeviceOrientationEvent !== 'undefined'
    && typeof DeviceOrientationEvent.requestPermission === 'function';
  if (!needsPermission) {
    attachOrientationListeners();
    tryMagnetometer();
  }

  // Recalibrate button = reset filter so user can re-stabilise
  document.getElementById('recenterBtn').addEventListener('click', () => {
    filterX = null; filterY = null;
    statusEl.textContent = '';
  });
})();
</script>
</body>
</html>
