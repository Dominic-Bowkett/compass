<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0f17" />
<title>Compass</title>
<style>
  :root {
    --bg: #0b0f17;
    --fg: #e8ecf1;
    --muted: #8a93a6;
    --accent: #ff4d4d;
    --ring: #1c2333;
    --ring-2: #2a3348;
    --tick: #6b7388;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #141b2c 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 16px;
  }
  header {
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .heading {
    font-variant-numeric: tabular-nums;
    font-size: 48px;
    font-weight: 300;
    margin-top: 6px;
    letter-spacing: 1px;
  }
  .cardinal {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 2px;
  }
  .compass-wrap {
    position: relative;
    width: min(85vw, 380px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pointer {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 18px solid var(--accent);
    filter: drop-shadow(0 0 6px rgba(255,77,77,0.6));
    z-index: 3;
  }
  .compass {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle, #0f1626 0%, #0a0f1a 70%),
      var(--ring);
    box-shadow:
      inset 0 0 0 2px var(--ring-2),
      inset 0 0 30px rgba(0,0,0,0.6),
      0 10px 40px rgba(0,0,0,0.5);
    position: relative;
    transition: transform 120ms linear;
    will-change: transform;
  }
  .compass svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 10px; height: 10px;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    min-height: 60px;
  }
  button {
    appearance: none;
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,77,77,0.35);
  }
  button:active { transform: scale(0.97); }
  .hidden { display: none !important; }
  .status {
    font-size: 12px;
    margin-top: 8px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Compass</h1>
    <div class="heading" id="heading">---&deg;</div>
    <div class="cardinal" id="cardinal">--</div>
  </header>

  <div class="compass-wrap">
    <div class="pointer"></div>
    <div class="compass" id="compass">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g id="ticks"></g>
        <text x="100" y="26" text-anchor="middle" fill="#ff4d4d" font-size="16" font-weight="700">N</text>
        <text x="174" y="105" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="600">E</text>
        <text x="100" y="184" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="600">S</text>
        <text x="26" y="105" text-anchor="middle" fill="#e8ecf1" font-size="14" font-weight="600">W</text>
        <text x="137" y="52" text-anchor="middle" fill="#8a93a6" font-size="9">NE</text>
        <text x="148" y="155" text-anchor="middle" fill="#8a93a6" font-size="9">SE</text>
        <text x="52" y="155" text-anchor="middle" fill="#8a93a6" font-size="9">SW</text>
        <text x="63" y="52" text-anchor="middle" fill="#8a93a6" font-size="9">NW</text>
      </svg>
      <div class="center-dot"></div>
    </div>
  </div>

  <footer>
    <button id="startBtn">Enable Compass</button>
    <div class="status" id="status">Tap to grant motion &amp; orientation access</div>
  </footer>
</div>

<script>
(function () {
  const compass = document.getElementById('compass');
  const headingEl = document.getElementById('heading');
  const cardinalEl = document.getElementById('cardinal');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const ticksGroup = document.getElementById('ticks');

  // Build tick marks
  const svgNS = 'http://www.w3.org/2000/svg';
  for (let deg = 0; deg < 360; deg += 5) {
    const isMajor = deg % 30 === 0;
    const len = isMajor ? 10 : 5;
    const x1 = 100 + Math.sin(deg * Math.PI / 180) * 90;
    const y1 = 100 - Math.cos(deg * Math.PI / 180) * 90;
    const x2 = 100 + Math.sin(deg * Math.PI / 180) * (90 - len);
    const y2 = 100 - Math.cos(deg * Math.PI / 180) * (90 - len);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? '#aab2c4' : '#4a5266');
    line.setAttribute('stroke-width', isMajor ? 1.5 : 1);
    ticksGroup.appendChild(line);
  }

  function cardinalFromDegrees(deg) {
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }

  // Vector-space low-pass filter: average sin/cos so the 0/360 wrap is handled correctly,
  // then animate the displayed angle toward the filtered target.
  // Tunables: SENSOR_ALPHA = how much each new raw reading moves the filter (lower = smoother, more lag)
  //           DISPLAY_LERP = how fast the visual catches up per frame
  //           DEAD_ZONE_DEG = ignore sub-degree jitter so the readout is steady when still
  const SENSOR_ALPHA = 0.15;
  const DISPLAY_LERP = 0.18;
  const DEAD_ZONE_DEG = 0.4;

  let filterX = null, filterY = null;
  let targetHeading = 0;
  let displayHeading = 0; // unwrapped — accumulates so CSS rotate() never takes the long way round
  let lastDisplayedInt = -1;
  let hasReading = false;

  function shortestAngleDiff(a, b) {
    return ((b - a) % 360 + 540) % 360 - 180;
  }

  function mod360(v) {
    return ((v % 360) + 360) % 360;
  }

  function tick() {
    if (hasReading) {
      const current = mod360(displayHeading);
      const diff = shortestAngleDiff(current, targetHeading);
      if (Math.abs(diff) > DEAD_ZONE_DEG) {
        displayHeading += diff * DISPLAY_LERP;
      }
      compass.style.transform = `rotate(${-displayHeading}deg)`;
      const rounded = Math.round(mod360(displayHeading)) % 360;
      if (rounded !== lastDisplayedInt) {
        headingEl.textContent = String(rounded).padStart(3, '0') + '°';
        cardinalEl.textContent = cardinalFromDegrees(mod360(displayHeading));
        lastDisplayedInt = rounded;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function onOrientation(event) {
    // iOS exposes true compass heading via webkitCompassHeading (0 = N, clockwise)
    // Others expose `alpha` (0 = device's reference, counter-clockwise from N when absolute=true)
    let heading = null;
    if (typeof event.webkitCompassHeading === 'number' && !isNaN(event.webkitCompassHeading)) {
      heading = event.webkitCompassHeading;
    } else if (event.absolute && typeof event.alpha === 'number') {
      heading = (360 - event.alpha) % 360;
    } else if (typeof event.alpha === 'number') {
      heading = (360 - event.alpha) % 360;
      statusEl.textContent = 'Reading is relative — may drift. Calibrate by waving phone in a figure 8.';
    }

    if (heading === null || isNaN(heading)) return;

    const rad = heading * Math.PI / 180;
    const x = Math.cos(rad);
    const y = Math.sin(rad);

    if (filterX === null) {
      filterX = x;
      filterY = y;
    } else {
      filterX = filterX * (1 - SENSOR_ALPHA) + x * SENSOR_ALPHA;
      filterY = filterY * (1 - SENSOR_ALPHA) + y * SENSOR_ALPHA;
    }
    targetHeading = (Math.atan2(filterY, filterX) * 180 / Math.PI + 360) % 360;

    if (!hasReading) {
      displayHeading = targetHeading; // seed unwrapped value on first reading
      hasReading = true;
      if (!statusEl.textContent.startsWith('Reading')) {
        statusEl.textContent = 'Point your phone — top edge indicates heading';
      }
    }
  }

  function attachListeners() {
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', onOrientation, true);
    }
    window.addEventListener('deviceorientation', onOrientation, true);
  }

  async function start() {
    startBtn.disabled = true;
    try {
      const needsPermission = typeof DeviceOrientationEvent !== 'undefined'
        && typeof DeviceOrientationEvent.requestPermission === 'function';
      if (needsPermission) {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state !== 'granted') {
          statusEl.textContent = 'Permission denied. Enable Motion & Orientation in Settings > Safari.';
          startBtn.disabled = false;
          return;
        }
      }
      attachListeners();
      startBtn.classList.add('hidden');
      statusEl.textContent = 'Waiting for sensor…';
      setTimeout(() => {
        if (!hasReading) {
          statusEl.textContent = 'No sensor data. Try moving the device or open on a phone.';
        }
      }, 3000);
    } catch (err) {
      statusEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener('click', start);

  // On browsers that don't need permission (most Android), auto-attach but keep button
  // so users can retry if the first reading doesn't arrive.
  if (!(typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function')) {
    attachListeners();
    statusEl.textContent = 'Move the phone to calibrate…';
  }
})();
</script>
</body>
</html>
